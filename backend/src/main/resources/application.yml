spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: cryptopal-core

  datasource:
    # Render supplies SPRING_DATASOURCE_* at runtime. Reading these values
    # directly prevents an unresolved legacy POSTGRES_HOST template from
    # blocking application startup.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:cryptopal}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:cryptopal}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:cryptopal}}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  elasticsearch:
    enabled: ${ELASTICSEARCH_ENABLED:false}
    url: ${ELASTICSEARCH_URL:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTIC_PASSWORD:}
  demo-data:
    enabled: ${APP_DEMO_DATA_ENABLED:false}
    password: ${APP_DEMO_DATA_PASSWORD:}
